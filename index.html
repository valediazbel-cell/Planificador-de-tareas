<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificacion de Tares </title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">
                📒 Planifica tu tarea
            </a>
        </div>
    </nav>
    <br>

    <div class="todo">
        <h1>Nueva Tarea </h1>

        <div class="formulario">


            <form class="neets-validated formulario1">

                <div class="mb-3">
                    <label for="validationTextarea" novalidate class="form-label texFormu">Tarea</label>
                    <textarea class="form-control texFormu" id="validationTarea" placeholder="Crear Tarea"
                        required></textarea>
                    <div class="alert alert-danger alertTarea ocultaAlert " id="alertTarea" role="alert">

                    </div>

                </div>

                <div class="mb-3">
                    <label for="validationTextarea" novalidate class="form-label texFormu">Descripcion</label>
                    <textarea class="form-control texFormu" id="validationDes" placeholder="Descripcion"
                        required></textarea>
                    <div class="alert alert-danger alertDes ocultaAlert" id="alertDes" role="alert">

                    </div>
                </div>
                <input id="validacionfecha" novalidate class="form-control texFormu" type="date" placeholder="Fecha"
                    aria-label="default input example" required>

                <div class="alert alert-danger alertFecha ocultaAlert" id="alertFecha" role="alert">

                </div>


                <div class="mb-3">
                    <select id="validationprio" class="form-select prioridad priorlista" required
                        aria-label="select example">
                        <option value="">Prioridad</option>
                        <option value="1">Alta</option>
                        <option value="2">Media</option>
                        <option value="3">Baja</option>
                    </select>
                    <div class="invalid-feedback">Eliga una prioridad
                    </div>

                </div>
                <div class="alert alert-danger alertPrio ocultaAlert" id="alertPrio" role="alert">

                </div>
            </form>
            <br>
            <button type="button" onclick="validFormFieldInput()"
                class="btn btn-outline-primary botonAgregar">Agregar</button>

            <br>
            <br>


            <div class="listaTareas">
                <p class="titoloListaTareas"> Lista de tareas</p>
                <ul class="list-group">
                    <li class="list-group-item tarea">
                        <div>
                            <input class="form-check-input me-1" type="checkbox" value="" id="firstCheckbox">
                            <label class="form-check-label" for="firstCheckbox">Crear Html </label>
                        </div>
                        <div>
                            <button type="button" class="btn btn-outline-primary botonEliminar">Eliminar</button>
                        </div>

                    </li>
                    <li class="list-group-item tarea">
                        <div>
                            <input class="form-check-input me-1" type="checkbox" value="" id="secondCheckbox">
                            <label class="form-check-label" for="secondCheckbox">Css</label>
                        </div>
                        <div>
                            <button type="button" class="btn btn-outline-primary botonEliminar">Eliminar</button>
                        </div>

                    </li>
                    <li class="list-group-item tarea">
                        <div>
                            <input class="form-check-input me-1" type="checkbox" value="" id="thirdCheckbox">
                            <label class="form-check-label" for="thirdCheckbox">Ser feliz</label>
                        </div>
                        <div>
                            <button type="button" class="btn btn-outline-primary botonEliminar">Eliminar</button>
                        </div>
                    </li>
                </ul>


            </div>



        </div>



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
</body>

</html>
