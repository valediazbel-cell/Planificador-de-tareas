                    </div>

                        <div class="alert alert-danger alertFecha ocultaAlert" id="alertFecha" role="alert"></div>
                    </div>


                    <div class="mb-3">
                        <label for="validationprio" class="form-label titulotexFormu">Prioridad</label>
                        <select id="validationprio" class="form-select prioridad priorlista"
                            aria-label="select example">
                            <option value="Selecciona">Selecciona</option>
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                        </select>
                        <div class="alert alert-danger alertPrio ocultaAlert" id="alertPrio" role="alert"></div>
                    </div>
                    <br>
                    <button type="submit" class="btn btn-outline-primary botonAgregar">Agregar</button>
                </form>

            </div>
